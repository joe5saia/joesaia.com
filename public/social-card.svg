<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Joe Saia social card</title>
  <desc id="description">A dark, refined social preview card with Amp-inspired code motifs and subtle cat-like geometry.</desc>
  <defs>
    <radialGradient id="glow" cx="72%" cy="28%" r="62%">
      <stop offset="0" stop-color="#6df7c8" stop-opacity="0.42" />
      <stop offset="0.4" stop-color="#5f7cff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#0f1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="160" x2="1040" y1="98" y2="532" gradientUnits="userSpaceOnUse">
