    <text x="250" y="286" fill="#f6f2e8" font-size="66" font-weight="750" letter-spacing="-2">Engineering, data,</text>
    <text x="250" y="358" fill="#f6f2e8" font-size="66" font-weight="750" letter-spacing="-2">and AI systems</text>
    <text x="252" y="417" fill="#a9b2c6" font-size="27" font-weight="500">Quietly building practical software with sharp teams.</text>
