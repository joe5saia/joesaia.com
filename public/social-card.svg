    <path d="M60 374H1140" />
    <path d="M60 458H1140" />
    <path d="M204 54V576" />
    <path d="M408 54V576" />
    <path d="M612 54V576" />
    <path d="M816 54V576" />
    <path d="M1020 54V576" />
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="132" y="82" width="936" height="466" rx="34" fill="url(#panel)" stroke="#303747" />
    <rect x="158" y="108" width="884" height="414" rx="24" fill="#11151f" stroke="#252b3a" />
  </g>

  <g transform="translate(802 137)" opacity="0.9">
