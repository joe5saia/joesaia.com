<!-- @dsCard group="Colors" viewport="700x150" name="Brand & Ink" subtitle="Ink, gold accent, cream base" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-cream);padding:20px;}
  .row{display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-line);}
  .chip{height:74px;}
  .meta{padding:8px 10px;background:var(--color-white);}
  .meta b{display:block;font-size:0.82rem;color:var(--color-ink);}
  .meta code{font-family:var(--font-mono);font-size:0.72rem;color:var(--color-muted);}
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:#16263d"></div><div class="meta"><b>Ink</b><code>#16263D</code></div></div>
  <div class="sw"><div class="chip" style="background:#c2a45f"></div><div class="meta"><b>Gold</b><code>#C2A45F</code></div></div>
  <div class="sw"><div class="chip" style="background:#f4f2ec"></div><div class="meta"><b>Cream</b><code>#F4F2EC</code></div></div>
  <div class="sw"><div class="chip" style="background:#faf8f2"></div><div class="meta"><b>Cream 2</b><code>#FAF8F2</code></div></div>
</div></body></html>
