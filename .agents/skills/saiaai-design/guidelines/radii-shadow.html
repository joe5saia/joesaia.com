<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & Shadow" subtitle="18/12/8px radii, square buttons, soft shadow" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-cream);padding:24px;color:var(--color-ink);}
  .row{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;}
  .box{display:grid;gap:8px;justify-items:center;}
  .b{width:88px;height:62px;background:var(--color-cream-2);border:1px solid var(--color-line);}
  .soft{box-shadow:var(--shadow-soft);}
  small{font-size:0.72rem;color:var(--color-muted);font-family:var(--font-mono);}
</style></head>
<body><div class="row">
  <div class="box"><div class="b" style="border-radius:18px"></div><small>--radius-lg 18</small></div>
  <div class="box"><div class="b" style="border-radius:12px"></div><small>--radius-md 12</small></div>
  <div class="box"><div class="b" style="border-radius:8px"></div><small>--radius-sm 8</small></div>
  <div class="box"><div class="b" style="border-radius:0"></div><small>button 0</small></div>
  <div class="box"><div class="b soft" style="border-radius:18px"></div><small>--shadow-soft</small></div>
</div></body></html>
