<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & Text" subtitle="Body, muted, hairline, mist" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-cream);padding:20px;}
  .row{display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-line);}
  .chip{height:74px;}
  .meta{padding:8px 10px;background:var(--color-white);}
  .meta b{display:block;font-size:0.82rem;color:var(--color-ink);}
  .meta code{font-family:var(--font-mono);font-size:0.72rem;color:var(--color-muted);}
</style></head>
<body><div class="row">
  <div class="sw"><div class="chip" style="background:#15233a"></div><div class="meta"><b>Text body</b><code>#15233A</code></div></div>
  <div class="sw"><div class="chip" style="background:#5e6b7c"></div><div class="meta"><b>Muted</b><code>#5E6B7C</code></div></div>
  <div class="sw"><div class="chip" style="background:#a8b2c2"></div><div class="meta"><b>Mist</b><code>#A8B2C2</code></div></div>
  <div class="sw"><div class="chip" style="background:#e2ddd0"></div><div class="meta"><b>Line</b><code>#E2DDD0</code></div></div>
</div></body></html>
