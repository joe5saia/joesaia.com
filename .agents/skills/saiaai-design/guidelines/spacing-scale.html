<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="0.25 → 5rem rhythm" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-cream);padding:24px;color:var(--color-ink);}
  .row{display:flex;gap:16px;align-items:flex-end;}
  .box{display:grid;gap:6px;justify-items:center;}
  .bar{background:var(--color-gold);width:22px;}
  small{font-size:0.68rem;color:var(--color-muted);font-family:var(--font-mono);}
</style></head>
<body><div class="row">
  <div class="box"><div class="bar" style="height:4px"></div><small>1·4</small></div>
  <div class="box"><div class="bar" style="height:8px"></div><small>2·8</small></div>
  <div class="box"><div class="bar" style="height:12px"></div><small>3·12</small></div>
  <div class="box"><div class="bar" style="height:16px"></div><small>4·16</small></div>
  <div class="box"><div class="bar" style="height:24px"></div><small>5·24</small></div>
  <div class="box"><div class="bar" style="height:32px"></div><small>6·32</small></div>
  <div class="box"><div class="bar" style="height:48px"></div><small>7·48</small></div>
  <div class="box"><div class="bar" style="height:80px"></div><small>8·80</small></div>
</div></body></html>
