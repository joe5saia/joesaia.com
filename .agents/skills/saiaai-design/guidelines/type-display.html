<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-serif);background:var(--color-cream);padding:24px;color:var(--color-ink);}
  .d{font-size:3.6rem;font-weight:500;letter-spacing:-0.025em;line-height:1.02;margin:0;}
  .h2{font-size:2.4rem;font-weight:500;letter-spacing:-0.02em;margin:14px 0 0;}
  .h3{font-size:1.5rem;font-weight:500;letter-spacing:-0.01em;margin:10px 0 0;}
  code{font-family:var(--font-mono);font-size:0.7rem;color:var(--color-muted);}
</style></head>
<body>
  <p class="d">Practical software.</p>
  <p class="h2">Senior engineering judgment</p>
  <p class="h3">Approachable consulting, premium execution</p>
  <p><code>Cormorant Garamond · 500 · --font-serif</code></p>
</body></html>
