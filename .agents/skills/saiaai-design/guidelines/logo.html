<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-serif);background:var(--color-cream);}
  .row{display:flex;}
  .tile{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;height:230px;}
  svg{display:block;}
  .wm{font-weight:600;letter-spacing:0.14em;font-size:2.3rem;line-height:1;}
  .wm .ai{color:var(--color-gold);}
  .star-lg{fill:var(--color-gold);}
  .tw{fill:var(--color-gold);opacity:.92;}
</style></head>
<body><div class="row">
  <div class="tile" style="background:var(--color-cream-2);border-right:1px solid var(--color-line)">
    <svg width="54" height="54" viewBox="0 0 64 64"><path class="tw" d="M45.5 8 L47 13.6 L52.6 15 L47 16.4 L45.5 22 L44 16.4 L38.4 15 L44 13.6 Z"/><path class="star-lg" d="M30 6 L33 30 L57 33 L33 36 L30 60 L27 36 L3 33 L27 30 Z"/></svg>
    <span class="wm" style="color:var(--color-ink)">Saia<span class="ai">AI</span></span>
  </div>
  <div class="tile" style="background:var(--color-ink)">
    <svg width="54" height="54" viewBox="0 0 64 64"><path class="tw" d="M45.5 8 L47 13.6 L52.6 15 L47 16.4 L45.5 22 L44 16.4 L38.4 15 L44 13.6 Z"/><path class="star-lg" d="M30 6 L33 30 L57 33 L33 36 L30 60 L27 36 L3 33 L27 30 Z"/></svg>
    <span class="wm" style="color:var(--color-cream-2)">Saia<span class="ai">AI</span></span>
  </div>
</div></body></html>
